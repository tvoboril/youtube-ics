name: validate

# PR gate (ADR-0007 Tier 1 / source track). Branch protection on `main` requires
# the `validate` check to pass.
#
# Deliberately does NOT build the image. It used to, and after the UBI9 migration
# that meant joining the tailnet and dragging both python bases out of JFrog on
# every push to a PR — minutes of setup and hundreds of MB of transfer to prove
# something the merge build proves anyway. Same conclusion cw-neuro-trainer
# reached: a PR gate only needs to know the code is good; the image is proved on
# merge to main in build.yml, where it has to be built regardless.
#
# What is left is baseline and cheap: the package imports, the tests pass, and the
# Dockerfile still pins its bases by digest.
on:
  pull_request:
    branches: [main]

concurrency:
  # One in-flight validate per branch. Pushing a fix to a PR cancels the
  # previous run instead of leaving two gates racing — a superseded run can
  # otherwise keep burning minutes against a branch that no longer exists.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (with dev extras)
        run: pip install -e ".[dev]"

      - name: Tests
        run: pytest -q

      # Cheap structural check on the Dockerfile: catches a base that has drifted
      # to a floating tag without pulling a single layer.
      - name: Bases are digest-pinned
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r img; do
            if ! printf '%s' "$img" | grep -qE '@sha256:[0-9a-f]{64}$'; then
              echo "::error file=Dockerfile::FROM is not digest-pinned: ${img}"
              fail=1
            fi
          done < <(grep -E '^FROM' Dockerfile | sed -E 's/^FROM[[:space:]]+//; s/[[:space:]]+AS[[:space:]]+.*//')
          [ "$fail" -eq 0 ] && echo "all FROM lines are digest-pinned"
          exit "$fail"
